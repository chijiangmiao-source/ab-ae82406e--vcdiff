services:
  web:
    build:
      context: .
      target: base
    image: vcdiff-checker:latest
    container_name: vcdiff-checker-web
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
    ports:
      # Host-side port is configurable: HOST_PORT=9090 docker compose up web
      - "${HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status==200 else 1)"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 3s
    restart: unless-stopped

  # One-shot verification gate: build check + decoder unit tests +
  # interface/HTTP smoke against the live "web" service.  It runs once and
  # exits with the gate's status code (0 = pass).
  verify:
    build:
      context: .
      target: verify
    image: vcdiff-checker-verify:latest
    container_name: vcdiff-checker-verify
    depends_on:
      web:
        condition: service_healthy
    environment:
      BASE_URL: "http://web:8080"
    restart: ""
